name: HomeOS
options:
  bundleIdPrefix: com.luanfleck
  deploymentTarget:
    iOS: "17.0"
  defaultConfig: Debug
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "2"       # 2 = iPad only
    SUPPORTS_MACCATALYST: NO
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  HomeOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HomeOS
        excludes:
          - "**/.DS_Store"
    info:
      path: HomeOS/Resources/Info.plist
      properties:
        CFBundleName: HomeOS
        CFBundleDisplayName: HomeOS
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.luanfleck.HomeOS
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: ""
